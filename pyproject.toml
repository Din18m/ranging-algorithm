[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htap-ranker"
version = "0.1.0"
description = "Requirement-aware stable ranking of HTAP configurations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
benchmark = ["duckdb>=1.4,<2"]

[project.scripts]
htap-ranker = "htap_ranker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
